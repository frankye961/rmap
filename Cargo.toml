[package]
name = "rmap"
version = "0.3.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", default-features = false }
rig = { version = "=0.42.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
